<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .line { stroke: #222222; stroke-width: 2; fill: none; }
      .entity { fill: #ffffff; stroke: #222222; stroke-width: 2.2; }
      .relationship { fill: #ffffff; stroke: #222222; stroke-width: 2.2; }
      .attribute { fill: #ffffff; stroke: #222222; stroke-width: 1.8; }
      .entity-text { font-family: "Times New Roman", serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #111111; }
      .rel-text { font-family: "Times New Roman", serif; font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #111111; }
      .attr-text { font-family: "Times New Roman", serif; font-size: 15px; text-anchor: middle; dominant-baseline: middle; fill: #111111; }
      .card-text { font-family: "Times New Roman", serif; font-size: 15px; text-anchor: middle; dominant-baseline: middle; fill: #111111; }
      .title { font-family: "Times New Roman", serif; font-size: 30px; font-weight: 700; text-anchor: middle; fill: #111111; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="950"/>
  <text class="title" x="800" y="54">Entity Relationship Diagram of PQC Evidence Storing System</text>

